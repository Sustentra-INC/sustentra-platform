<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Activity log</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3A40C0;text-decoration:none}a:hover{color:#2B3099}
button,input{font-family:inherit}
.ev:hover{background:#F7F8FB}
</style>
</helmet>
<div style="position: relative; min-height: 100vh; overflow: hidden; color: #14151A; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif; font-size: 14px; line-height: 1.45; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased">
  <div aria-hidden="true" style="pointer-events: none"><dc-import name="coverage" hint-size="100%,960px"></dc-import></div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(20,21,40,0.28)"></div>

  <aside role="dialog" aria-modal="true" aria-labelledby="alt" style="position: absolute; top: 16px; right: 16px; width: 468px; max-width: calc(100% - 32px); height: calc(100vh - 32px); box-sizing: border-box; display: flex; flex-direction: column; border-radius: 20px; background: #FFFFFF; box-shadow: 0 24px 60px rgba(20,21,40,0.22); overflow: hidden">
    <div style="display: flex; flex-direction: column; gap: 14px; padding: 18px 16px 14px 18px; border-bottom: 1px solid #EEEFF4">
      <div style="display: flex; align-items: center; gap: 10px">
        <span aria-hidden="true" style="flex: none; display: inline-flex; align-items: center; justify-content: center; width: 22px; color: #2E3299"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><defs><mask id="dt-clock" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24"><rect width="24" height="24" fill="#fff"/><path d="M12 7.5V12l3 2" stroke="#000" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></mask></defs><g mask="url(#dt-clock)"><circle cx="12" cy="12" r="9.5" fill="currentColor"/></g></svg></span>
        <span style="flex: 1; display: flex; flex-direction: column"><h2 id="alt" style="margin: 0; font-size: 17px; font-weight: 700">Activity log</h2></span>
        <button type="button" aria-label="Export activity" title="Export" style="width: 34px; height: 34px; border: 0; border-radius: 10px; background: #F1F2F6; color: #3B3D46; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 13.5a1.5 1.5 0 0 1 3 0V18h12v-4.5a1.5 1.5 0 0 1 3 0v5A2.5 2.5 0 0 1 18.5 21h-13A2.5 2.5 0 0 1 3 18.5z" fill="currentColor" fill-opacity=".38"/><path d="M13 15.4a1.4 1.4 0 0 1-2 0l-4.2-4.2c-.9-.9-.3-2.2.9-2.2H10V4.5a2 2 0 0 1 4 0V9h2.3c1.2 0 1.8 1.3.9 2.2z" fill="currentColor"/></svg></button>
        <button type="button" aria-label="Close activity log" style="width: 34px; height: 34px; border: 0; border-radius: 10px; background: #F1F2F6; color: #3B3D46; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div style="display: flex; gap: 8px">
        <label style="flex: 1; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-radius: 11px; background: #F3F4F8; color: #6B6E78; box-sizing: border-box"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path fill="currentColor" fill-opacity=".38" fill-rule="evenodd" d="M10.5 3a7.5 7.5 0 1 1 0 15 7.5 7.5 0 0 1 0-15zm0 3a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9z"/><rect x="16" y="14.2" width="3.2" height="8" rx="1.6" transform="rotate(-45 17.6 18.2)" fill="currentColor"/></svg><input type="search" aria-label="Search activity" placeholder="Search by document or value" style="flex: 1; min-width: 0; border: 0; background: transparent; font-size: 13px; outline: none"></label>
        <button type="button" aria-haspopup="listbox" style="display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 10px 0 8px; border: 0; border-radius: 11px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #DCDEE6; color: #14151A; font-size: 13px; font-weight: 600; cursor: pointer"><span aria-hidden="true" style="display: inline-flex"><span style="width: 22px; height: 22px; border-radius: 11px; background: #E3F5EA; color: #19663E; font-size: 9px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px #FFFFFF">LC</span><span style="margin-left: -6px; width: 22px; height: 22px; border-radius: 11px; background: #FFF1DE; color: #8A4B12; font-size: 9px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px #FFFFFF">RI</span></span>Everyone<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#55585F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
      </div>
      <div role="tablist" aria-label="Event type" style="display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: #F1F2F6">
        <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
          <button type="button" role="tab" aria-selected="{{t.sel}}" onClick="{{t.pick}}" style="flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 8px; border: 0; border-radius: 9px; background: {{t.bg}}; color: {{t.fg}}; box-shadow: {{t.shadow}}; font-size: 13px; font-weight: 600; cursor: pointer">{{t.label}}<span style="font-size: 12px; font-weight: 600; color: {{t.cfg}}">{{t.n}}</span></button>
        </sc-for>
      </div>
    </div>

    <div style="flex: 1; min-height: 0; overflow: auto; padding: 4px 8px 12px">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="2">
        <div style="position: sticky; top: 0; z-index: 1; display: flex; align-items: center; justify-content: space-between; padding: 14px 10px 6px; background: #FFFFFF; font-size: 12px; font-weight: 600; color: #63666F"><span>{{d.label}}</span><span style="font-weight: 500">{{d.count}}</span></div>
        <sc-for list="{{d.events}}" as="e" hint-placeholder-count="3">
          <div class="ev" style="display: flex; gap: 12px; padding: 10px; border-radius: 12px">
            <span aria-hidden="true" style="position: relative; flex: none; display: block; width: 34px; height: 34px">
              <span style="display: flex; width: 34px; height: 34px; border-radius: 17px; background: {{e.avBg}}; color: {{e.avFg}}; font-size: 11px; font-weight: 700; align-items: center; justify-content: center">{{e.initials}}</span>
              <span style="position: absolute; right: -3px; bottom: -3px; width: 18px; height: 18px; border-radius: 9px; background: {{e.icBg}}; color: #FFFFFF; box-shadow: 0 0 0 2px #FFFFFF; display: inline-flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="{{e.icon}}"/></svg></span>
            </span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px">
              <span style="font-size: 13px; color: #3B3D46; text-wrap: pretty"><b style="color: #14151A; font-weight: 600">{{e.who}}</b> {{e.verb}} <b style="color: #14151A; font-weight: 600">{{e.obj}}</b>{{e.tail}}</span>
              <span style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px">
                <a href="#" style="max-width: 100%; height: 24px; padding: 0 8px; border-radius: 8px; background: #F1F2F6; color: #2E3299; font-size: 12px; font-weight: 500; display: inline-flex; align-items: center; gap: 5px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true"><defs><mask id="dt-doc" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24"><rect width="24" height="24" fill="#fff"/><path d="M8.5 13h7M8.5 17h4.5" stroke="#000" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></mask></defs><g mask="url(#dt-doc)"><path d="M6.5 2H14v4a2.5 2.5 0 0 0 2.5 2.5H20v11A2.5 2.5 0 0 1 17.5 22h-11A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" fill="currentColor"/><path d="M15.5 2.4L19.6 6.5H16.5a1 1 0 0 1-1-1z" fill="currentColor" fill-opacity=".38"/></g></svg>{{e.file}}</a>
                <sc-if value="{{e.hasTag}}" hint-placeholder-val="{{ false }}"><span style="height: 22px; padding: 0 9px 0 8px; border-radius: 999px; background: {{e.tagBg}}; color: {{e.tagFg}}; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px"><span aria-hidden="true" style="flex: none; width: 7px; height: 7px; border-radius: 4px; background: {{e.tagFg}}"></span>{{e.tag}}</span></sc-if>
              </span>
            </span>
            <span style="flex: none; font-size: 12px; color: #8A8D96; padding-top: 1px">{{e.time}}</span>
          </div>
        </sc-for>
      </sc-for>
      <div style="display: flex; justify-content: center; padding: 10px 0 4px"><button type="button" style="height: 34px; padding: 0 14px; border: 0; border-radius: 10px; background: #F1F2F6; color: #14151A; font-size: 13px; font-weight: 600; cursor: pointer">Load older activity</button></div>
    </div>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"filter":{"editor":"enum","options":["all","uploads","reviews","requests"],"default":"all"},"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const f = st.filter ?? (this.props.filter ?? 'all');
    const T = [['all', 'All', '780'], ['uploads', 'Uploads', '150'], ['reviews', 'Reviews', '627'], ['requests', 'Requests', '3']];
    const tabs = T.map(([k, label, n]) => { const on = f === k; return { label, n, sel: on ? 'true' : 'false', bg: on ? '#FFFFFF' : 'transparent', fg: on ? '#14151A' : '#55585F', cfg: on ? '#3A40C0' : '#8A8D96', shadow: on ? '0 1px 2px rgba(20,21,26,0.10)' : 'none', pick: () => this.setState({ filter: k }) }; });
    const people = { you: ['You', 'D', '#14151A', '#FFFFFF'], lc: ['L. Chen', 'LC', '#E3F5EA', '#19663E'], ri: ['R. Iqbal', 'RI', '#FFF1DE', '#8A4B12'], mo: ['M. Osei', 'MO', '#E8E9FB', '#2E3299'] };
    const kinds = {
      uploads: ['#3A40C0', 'M12 19V6M6.5 11.5L12 6l5.5 5.5'],
      reviews: ['#1F8A55', 'M5 12.5l4.5 4.5L19 7.5'],
      requests: ['#E9A23B', 'M21 3L10 14M21 3l-7 18-4-7-7-4z']
    };
    const E = [
      ['Today · Sun, Nov 22', 'uploads', 'you', 'uploaded', 'a new version', '', 'NPL_Electric_Supply_Contract.pdf', 'Replaced 3:30 PM copy', '3:31 PM'],
      ['Today · Sun, Nov 22', 'uploads', 'you', 'uploaded', 'a document', '', 'kent_electricity_feb_2025.pdf', '', '3:31 PM'],
      ['Sat, Jan 17, 2026', 'reviews', 'lc', 'accepted', '2 Electricity consumed values', ' as read', 'modesto_electric_mar_2025.pdf', '', '9:41 AM'],
      ['Sat, Jan 17, 2026', 'reviews', 'lc', 'accepted', 'Natural gas consumed', ' as read', 'kent_gas_jul_2025.pdf', '', '9:29 AM'],
      ['Sat, Jan 17, 2026', 'reviews', 'lc', 'accepted', 'Fuel purchased', ' as read', 'kent_fleetcard_q4_2025.pdf', '', '9:17 AM'],
      ['Sat, Jan 17, 2026', 'reviews', 'ri', 'accepted', 'Fuel delivered', ' as read', 'kent_propane_may.pdf', '', '7:59 AM'],
      ['Sat, Jan 17, 2026', 'reviews', 'ri', 'accepted', 'Electricity consumed', ' as read', 'tualatin_electric_sep_2025.pdf', '', '7:35 AM'],
      ['Fri, Jan 16, 2026', 'requests', 'mo', 'drafted', 'a request', ' to replace a document', 'kent_gas_sep_2025.pdf', 'Draft', '4:12 PM'],
      ['Fri, Jan 16, 2026', 'requests', 'mo', 'sent', 'request #1', ' to the client', 'scan_0417.pdf', 'Requested', '11:05 AM'],
      ['Fri, Jan 16, 2026', 'requests', 'mo', 'added', 'a request', ' for a legible copy', 'scan_0417.pdf', '', '10:58 AM']
    ];
    const tagTone = { 'Draft': ['#FFF1DE', '#8A4B12'], Requested: ['#E8E9FB', '#2E3299'] };
    const rows = E.filter((e) => f === 'all' ? e[1] !== 'requests' : e[1] === f);
    const totals = { 'Today · Sun, Nov 22': '3 events', 'Sat, Jan 17, 2026': '41 events', 'Fri, Jan 16, 2026': '3 events' };
    const days = [];
    rows.forEach(([day, kind, p, verb, obj, tail, file, tag, time]) => {
      let d = days.find((x) => x.label === day);
      if (!d) { d = { label: day, count: totals[day], events: [] }; days.push(d); }
      const [who, initials, avBg, avFg] = people[p];
      const tt = tagTone[tag] || ['#F1F2F6', '#4A4C55'];
      d.events.push({ who, initials, avBg, avFg, verb, obj, tail, file, time, icBg: kinds[kind][0], icon: kinds[kind][1], hasTag: !!tag, tag, tagBg: tt[0], tagFg: tt[1] });
    });
    return { tabs, days };
  }
}
</script>
</body>
</html>
