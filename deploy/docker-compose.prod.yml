# Production stack on the EC2 app host (/opt/sustentra).
# Values come from /opt/sustentra/.env (written by user_data, updated by the deploy pipeline).
#
#   docker compose -f docker-compose.prod.yml --env-file .env up -d

x-hardening: &hardening
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  restart: unless-stopped

services:
  caddy:
    <<: *hardening
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: ${LOG_GROUP_PREFIX:-/sustentra/prod}/caddy
        tag: "{{.Name}}"
    image: caddy:2.8-alpine
    user: "1000:1000"
    # The official image ships /usr/bin/caddy with a file capability (cap_net_bind_service).
    # With cap_drop: ALL + no-new-privileges the kernel refuses to exec such a binary
    # ("operation not permitted") and the container restart-loops. Allow exactly that
    # one capability and let the file capability apply; everything else stays dropped.
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:false
    # Allow a non-root process to bind 80/443 inside the container's own network namespace.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "80"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN must be set}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/sustentra/caddy/data:/data
      - /opt/sustentra/caddy/config:/config
    tmpfs:
      - /tmp
    depends_on:
      - web
      - api

  web:
    <<: *hardening
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: ${LOG_GROUP_PREFIX:-/sustentra/prod}/web
        tag: "{{.Name}}"
    image: ${WEB_IMAGE:?}:${WEB_TAG:-latest}
    # The web image must define a non-root USER (MVP-5 Dockerfile).
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      # Server-side auth guard (frontend/lib/auth-guard.ts) calls the API directly
      # on the compose network; NEXT_PUBLIC_BACKEND_API_URL is the relative "/api".
      BACKEND_INTERNAL_URL: http://api:8000
    tmpfs:
      - /tmp
      - /app/.next/cache
    expose:
      - "3000"

  api:
    <<: *hardening
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: ${LOG_GROUP_PREFIX:-/sustentra/prod}/api
        tag: "{{.Name}}"
    image: ${API_IMAGE:?}:${API_TAG:-latest}
    # The api image must define a non-root USER (MVP-5 Dockerfile).
    environment:
      AWS_REGION: ${AWS_REGION}
    # Written by deploy.sh from Parameter Store (/<env>/*) on every deploy.
    env_file:
      - app.env
    volumes:
      # Only writable app path (JSONL stores / uploads until they move to RDS/S3).
      - /opt/sustentra/data:/app/data
    tmpfs:
      - /tmp
    expose:
      - "8000"
