name: ci

# Pull-request checks (and the same checks on main).
# Make "ci / backend" and "ci / frontend" required status checks in
# Settings -> Branches -> main so a failing gate blocks the merge.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sustentra_admin
          POSTGRES_PASSWORD: ci-admin-password
          POSTGRES_DB: sustentra
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sustentra_admin -d sustentra"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://sustentra_admin:ci-admin-password@localhost:5432/sustentra
      APP_DATABASE_URL: postgresql://app_user:ci-app-password@localhost:5432/sustentra
      TEST_DATABASE_URL: postgresql://sustentra_admin:ci-admin-password@localhost:5432/sustentra
      TEST_APP_DATABASE_URL: postgresql://app_user:ci-app-password@localhost:5432/sustentra
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install
        run: pip install -r backend/requirements-dev.txt

      - name: ruff
        run: ruff check backend

      - name: mypy
        run: mypy -p backend.app

      - name: Migrations upgrade -> downgrade -> upgrade
        working-directory: backend
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic current

      - name: pytest + coverage gate (80%)
        run: pytest --cov --cov-report=term-missing --cov-fail-under=80

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: eslint
        run: npm run lint
      - name: tsc
        run: npm run typecheck
      - name: tests
        run: npm test -- --run --passWithNoTests
      - name: build
        run: npm run build
        env:
          NEXT_PUBLIC_BACKEND_API_URL: /api
