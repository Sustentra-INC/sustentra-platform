name: ci

# Pull-request checks (and the same checks on main).
# Make "ci / backend" and "ci / frontend" required status checks in
# Settings -> Branches -> main so a failing gate blocks the merge.

on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sustentra_admin
          POSTGRES_PASSWORD: ci-admin-password
          POSTGRES_DB: sustentra
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sustentra_admin -d sustentra"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://sustentra_admin:ci-admin-password@localhost:5432/sustentra
      APP_DATABASE_URL: postgresql://app_user:ci-app-password@localhost:5432/sustentra
      TEST_DATABASE_URL: postgresql://sustentra_admin:ci-admin-password@localhost:5432/sustentra
      TEST_APP_DATABASE_URL: postgresql://app_user:ci-app-password@localhost:5432/sustentra
      TEST_DB_REQUIRED: "1"
      TEST_DB_DISPOSABLE: "1"
      # Test-only HMAC key for login OTP codes (prod reads /prod/otp_hmac_secret from SSM).
      OTP_HMAC_SECRET: ci-only-otp-hmac-secret-not-used-anywhere-else
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install
        run: pip install -r backend/requirements-dev.txt

      - name: ruff
        run: ruff check backend

      - name: mypy
        run: mypy -p backend.app

      - name: Migrations upgrade -> downgrade -> upgrade
        working-directory: backend
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic current

      - name: Verify runtime DB role safety
        run: |
          python - <<'PY'
          import os
          import psycopg2

          app_url = os.environ["TEST_APP_DATABASE_URL"]
          admin_url = os.environ["TEST_DATABASE_URL"]

          with psycopg2.connect(app_url) as app_conn:
            with app_conn.cursor() as cur:
              cur.execute("SELECT current_database(), current_user")
              current_database, current_user = cur.fetchone()

          if current_user != "app_user":
            raise SystemExit(f"Runtime DB user must be app_user, got {current_user!r}")

          with psycopg2.connect(admin_url) as admin_conn:
            with admin_conn.cursor() as cur:
              cur.execute(
                "SELECT rolsuper, rolbypassrls, rolcreatedb, rolcreaterole "
                "FROM pg_roles WHERE rolname = 'app_user'"
              )
              role_flags = cur.fetchone()

          if role_flags is None:
            raise SystemExit("Role 'app_user' is missing")
          if any(role_flags):
            raise SystemExit(
              "Role 'app_user' must not have superuser/bypassrls/createdb/createrole privileges"
            )

          print(f"Validated runtime DB identity: app_user on {current_database}")
          PY

      - name: pytest + coverage gate (80%)
        run: pytest --require-test-db --cov --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=80

      - name: Coverage summary
        if: always()
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          summary_file = os.environ.get("GITHUB_STEP_SUMMARY")
          coverage_xml = Path("coverage.xml")

          lines = [
            "## Backend coverage",
            "",
          ]

          if coverage_xml.exists():
            root = ET.parse(coverage_xml).getroot()
            line_rate = float(root.attrib.get("line-rate", "0")) * 100
            branch_rate = float(root.attrib.get("branch-rate", "0")) * 100
            lines.extend(
              [
                f"- Line coverage: {line_rate:.2f}%",
                f"- Branch coverage: {branch_rate:.2f}%",
                f"- File: {coverage_xml}",
              ]
            )
          else:
            lines.append("- coverage.xml was not produced (tests likely failed before coverage output).")

          if summary_file:
            with open(summary_file, "a", encoding="utf-8") as fh:
              fh.write("\n".join(lines) + "\n")
          else:
            print("\n".join(lines))
          PY

      - name: Upload backend coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            coverage.xml
            .coverage
          if-no-files-found: warn

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: eslint
        run: npm run lint
      - name: tsc
        run: npm run typecheck
      - name: tests
        run: npm test -- --run --passWithNoTests
      - name: build
        run: npm run build
        env:
          NEXT_PUBLIC_BACKEND_API_URL: /api
