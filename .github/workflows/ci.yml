name: ci

# Pull-request checks (and the same checks on main).
# Make "ci / backend" and "ci / frontend" required status checks in
# Settings -> Branches -> main so a failing gate blocks the merge.

on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sustentra_admin
          POSTGRES_PASSWORD: ci-admin-password
          POSTGRES_DB: sustentra
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sustentra_admin -d sustentra"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://sustentra_admin:ci-admin-password@localhost:5432/sustentra
      APP_DATABASE_URL: postgresql://app_user:ci-app-password@localhost:5432/sustentra
      TEST_DATABASE_URL: postgresql://sustentra_admin:ci-admin-password@localhost:5432/sustentra
      TEST_APP_DATABASE_URL: postgresql://app_user:ci-app-password@localhost:5432/sustentra
      TEST_DB_REQUIRED: "1"
      TEST_DB_DISPOSABLE: "1"
      # Test-only HMAC key for login OTP codes (prod reads /prod/otp_hmac_secret from SSM).
      OTP_HMAC_SECRET: ci-only-otp-hmac-secret-not-used-anywhere-else
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install
        run: pip install -r backend/requirements-dev.txt

      - name: Pinned requirements match requirements*.in
        # Edit the .in files, then regenerate the .txt pins (command in their header).
        working-directory: backend
        run: |
          pip install --quiet "uv==0.11.*"
          for f in requirements requirements-dev; do
            cp "$f.txt" "/tmp/$f.txt"   # start from the committed pins: only .in edits change them
            uv pip compile "$f.in" --universal --python-version 3.12 --generate-hashes \
              --quiet --no-header -o "/tmp/$f.txt"
            if ! diff <(grep -v '^#' "$f.txt") <(grep -v '^#' "/tmp/$f.txt") > /dev/null; then
              echo "::error file=backend/$f.txt::$f.txt is out of date with $f.in - regenerate it (see its header)"
              exit 1
            fi
          done

      - name: ruff
        run: ruff check backend

      - name: mypy
        run: mypy -p backend.app

      - name: Migrations upgrade -> downgrade -> upgrade
        working-directory: backend
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic current

      - name: pytest + coverage gate (80%)
        # --require-test-db fails fast unless the test DB is migrated and app_user has no
        # superuser / BYPASSRLS / CREATEDB / CREATEROLE (backend/tests/db/_db_contract.py).
        run: pytest --require-test-db --cov --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=80

      - name: Coverage summary
        if: always()
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          summary_file = os.environ.get("GITHUB_STEP_SUMMARY")
          coverage_xml = Path("coverage.xml")

          lines = [
            "## Backend coverage",
            "",
          ]

          if coverage_xml.exists():
            root = ET.parse(coverage_xml).getroot()
            line_rate = float(root.attrib.get("line-rate", "0")) * 100
            branch_rate = float(root.attrib.get("branch-rate", "0")) * 100
            lines.extend(
              [
                f"- Line coverage: {line_rate:.2f}%",
                f"- Branch coverage: {branch_rate:.2f}%",
                f"- File: {coverage_xml}",
              ]
            )
          else:
            lines.append("- coverage.xml was not produced (tests likely failed before coverage output).")

          if summary_file:
            with open(summary_file, "a", encoding="utf-8") as fh:
              fh.write("\n".join(lines) + "\n")
          else:
            print("\n".join(lines))
          PY

      - name: Upload backend coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            coverage.xml
            .coverage
          if-no-files-found: warn

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: eslint
        run: npm run lint
      - name: tsc
        run: npm run typecheck
      - name: tests
        run: npm test -- --run --passWithNoTests
      - name: build
        run: npm run build
        env:
          NEXT_PUBLIC_BACKEND_API_URL: /api

  e2e:
    # TEST-002: one Playwright smoke test of the whole account lifecycle against the
    # real stack - db, mailpit and api from docker-compose.yml, the web app as a
    # production build on the runner (faster and closer to prod than `next dev`).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Start db, mailpit and api
        run: |
          docker compose up -d --build --wait db mailpit
          docker compose up -d --build api
          # The api runs migrations first; it is up when /auth/me answers 401.
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/v1/auth/me || true)
            [ "$code" = "401" ] && exit 0
            sleep 2
          done
          docker compose logs api
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build and start the web app
        working-directory: frontend
        run: |
          npm ci
          npm run build
          nohup npm start -- --port 3000 > /tmp/web.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/sign-in -o /dev/null && exit 0
            sleep 2
          done
          cat /tmp/web.log
          exit 1
        env:
          BACKEND_INTERNAL_URL: http://localhost:8000

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Smoke test
        working-directory: frontend
        run: npm run test:e2e
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_MAILPIT_URL: http://localhost:8025

      - name: Logs on failure
        if: failure()
        run: |
          docker compose logs api | tail -200
          tail -100 /tmp/web.log || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
