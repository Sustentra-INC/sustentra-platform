name: terraform-apply

# The ONLY way infrastructure changes are applied after the bootstrap.
# Manual trigger + approval on the GitHub environment ("production" / "staging").
# Actions -> terraform-apply -> Run workflow (from main).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to apply"
        type: choice
        options: [prod, staging]
        default: prod

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-apply-${{ inputs.environment }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  AWS_REGION: us-east-1
  TF_VERSION: "1.16.4"
  TF_ENV: ${{ inputs.environment }}
  TERRAFORM_ROLE_ARN: arn:aws:iam::012751249540:role/sustentra-${{ inputs.environment }}-terraform

defaults:
  run:
    working-directory: infra

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment == 'staging' && 'staging' || 'production' }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: terraform init -input=false -backend-config=environments/${{ env.TF_ENV }}.s3.tfbackend
      - run: terraform plan -input=false -var-file=environments/${{ env.TF_ENV }}.tfvars -out=tfplan
      - run: terraform apply -input=false tfplan
      - name: Outputs
        run: terraform output -no-color | tee -a "$GITHUB_STEP_SUMMARY"
