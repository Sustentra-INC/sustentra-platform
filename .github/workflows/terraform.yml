name: terraform

# - Pull requests: fmt + validate, then `terraform plan` (prod) with the read-only
#   plan role, posted as a PR comment.
# - Push to main: plan against prod with the terraform role.
# Applies run only in the separate, manually approved "terraform-apply" workflow.
#
# OPS-003: `validate` and `plan-pr` are required status checks on main. A required
# check that never reports blocks the merge forever, so the workflow runs on EVERY
# pull request; the `changes` job decides, and when nothing under infra/ changed
# both jobs are skipped - and a skipped job counts as passed.

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read

concurrency:
  group: terraform-plan-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  AWS_REGION: us-east-1
  TF_VERSION: "1.16.4" # keep in sync with `terraform -version` on the laptop
  PLAN_ROLE_ARN: arn:aws:iam::012751249540:role/sustentra-prod-terraform-plan
  TERRAFORM_ROLE_ARN: arn:aws:iam::012751249540:role/sustentra-prod-terraform

defaults:
  run:
    working-directory: infra

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.diff.outputs.infra }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        name: Did infra/ or this workflow change?
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "infra=true" >> "$GITHUB_OUTPUT"   # push: the paths filter above already decided
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$base"...HEAD | grep -qE '^(infra/|\.github/workflows/terraform\.yml$)'; then
            echo "infra=true" >> "$GITHUB_OUTPUT"
          else
            echo "infra=false" >> "$GITHUB_OUTPUT"
          fi

  validate:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - name: Validate bootstrap config
        working-directory: infra/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate

  plan-pr:
    if: >-
      github.event_name == 'pull_request'
      && needs.changes.outputs.infra == 'true'
      && github.event.pull_request.head.repo.full_name == github.repository
    needs: [changes, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: terraform init -input=false -backend-config=environments/prod.s3.tfbackend
      - name: terraform plan
        id: plan
        # -lock=false: the plan role is read-only and must not write the S3 lock file.
        run: |
          set +e
          terraform plan -input=false -lock=false -no-color \
            -var-file=environments/prod.tfvars -out=tfplan > plan.txt 2>&1
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
          set -e
          if [ -f tfplan ]; then terraform show -no-color tfplan > plan.txt; fi
      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-plan-prod -->';
            let body = fs.readFileSync('infra/plan.txt', 'utf8');
            const max = 60000;
            if (body.length > max) body = body.slice(0, max) + '\n... (truncated, see the workflow log)';
            const ok = '${{ steps.plan.outputs.exitcode }}' === '0';
            const summary = body.match(/Plan: .*|No changes\..*/)?.[0] ?? (ok ? 'Plan generated' : 'Plan FAILED');
            const text = `${marker}\n### Terraform plan (prod): ${ok ? '✅' : '❌'} ${summary}\n<details><summary>Show plan</summary>\n\n\`\`\`\n${body}\n\`\`\`\n</details>`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: text });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: text });
            }
      - name: Fail if plan failed
        if: steps.plan.outputs.exitcode != '0'
        run: exit 1

  plan-main:
    if: github.event_name == 'push'
    needs: [changes, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: terraform init -input=false -backend-config=environments/prod.s3.tfbackend
      - run: terraform plan -input=false -var-file=environments/prod.tfvars
