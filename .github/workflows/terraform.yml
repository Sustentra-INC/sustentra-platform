name: terraform

# - Pull requests: fmt + validate (no AWS access needed).
# - Push to main: plan against prod using the terraform role via OIDC.
# - Manual run (Actions tab -> terraform -> Run workflow): choose prod or
#   staging, plan, and optionally apply. Gated by the GitHub "production"
#   or "staging" environment.

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to plan/apply"
        type: choice
        options: [prod, staging]
        default: prod
      apply:
        description: "Run terraform apply after the plan"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: terraform-${{ inputs.environment || 'prod' }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  AWS_REGION: us-east-1
  TF_ENV: ${{ inputs.environment || 'prod' }}
  TERRAFORM_ROLE_ARN: arn:aws:iam::012751249540:role/sustentra-${{ inputs.environment || 'prod' }}-terraform
  TF_VERSION: "1.16.4" # keep in sync with `terraform -version` on the laptop

defaults:
  run:
    working-directory: infra

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - name: Validate bootstrap config
        working-directory: infra/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate

  plan:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment == 'staging' && 'staging' || 'production' }}
    permissions:
      contents: read
      id-token: write # required for GitHub OIDC
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: terraform init -input=false -backend-config=environments/${{ env.TF_ENV }}.s3.tfbackend
      - run: terraform plan -input=false -var-file=environments/${{ env.TF_ENV }}.tfvars -out=tfplan
      - name: Apply
        if: github.event_name == 'workflow_dispatch' && inputs.apply
        run: terraform apply -input=false tfplan
