name: terraform

# - Pull requests: fmt + validate (no AWS access needed).
# - Push to main: plan against prod using the terraform role via OIDC.
# - Manual run (Actions tab -> terraform -> Run workflow): plan + apply,
#   gated by the GitHub "production" environment.

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      apply:
        description: "Run terraform apply after the plan"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: terraform-prod
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  AWS_REGION: us-east-1
  TERRAFORM_ROLE_ARN: arn:aws:iam::012751249540:role/sustentra-prod-terraform
  TF_VERSION: "1.16.4" # keep in sync with `terraform -version` on the laptop

defaults:
  run:
    working-directory: infra

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - name: Validate bootstrap config
        working-directory: infra/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate

  plan:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write # required for GitHub OIDC
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: terraform init -input=false -backend-config=environments/prod.s3.tfbackend
      - run: terraform plan -input=false -var-file=environments/prod.tfvars -out=tfplan
      - name: Apply
        if: github.event_name == 'workflow_dispatch' && inputs.apply
        run: terraform apply -input=false tfplan
