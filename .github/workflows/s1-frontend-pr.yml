name: S1 Frontend PR Gate

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/s1-frontend-pr.yml"
  push:
    branches:
      - s1-ui
    paths:
      - "frontend/**"
      - ".github/workflows/s1-frontend-pr.yml"

jobs:
  fixture-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Unit tests
        run: npm test -- --run

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Fixture contract E2E
        run: npm run e2e:s1:fixture
