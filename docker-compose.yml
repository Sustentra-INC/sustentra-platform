services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: sustentra
      POSTGRES_USER: sustentra
      POSTGRES_PASSWORD: sustentra
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sustentra -d sustentra"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sustentra
      MINIO_ROOT_PASSWORD: sustentra-password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 sustentra sustentra-password;
      mc mb --ignore-existing local/sustentra-documents;
      "

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      DATABASE_URL: postgresql+psycopg2://sustentra:sustentra@postgres:5432/sustentra
      SUSTENTRA_PERSISTENCE_BACKEND: postgres
      SUSTENTRA_STORAGE_BACKEND: minio
      SUSTENTRA_S3_ENDPOINT_URL: http://minio:9000
      SUSTENTRA_S3_ACCESS_KEY_ID: sustentra
      SUSTENTRA_S3_SECRET_ACCESS_KEY: sustentra-password
      SUSTENTRA_S3_BUCKET: sustentra-documents
      SUSTENTRA_S3_REGION: us-east-1
      SUSTENTRA_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      SUSTENTRA_LLM_EXTRACTION_ENABLED: ${SUSTENTRA_LLM_EXTRACTION_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EXTRACTION_MODEL: ${OPENAI_EXTRACTION_MODEL:-gpt-4.1-mini}
    command: sh -c "alembic -c backend/alembic.ini upgrade head && uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  frontend:
    image: node:20
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    environment:
      NEXT_PUBLIC_BACKEND_API_URL: http://localhost:8000
      NEXT_PUBLIC_S1_DATA_MODE: backend
      NEXT_TELEMETRY_DISABLED: "1"
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres-data:
  minio-data:
  frontend-node-modules:
