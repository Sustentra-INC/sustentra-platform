# Local development stack:  docker compose up
#
#   web      http://localhost:3000        Next.js dev server
#   api      http://localhost:8000        FastAPI (docs: http://localhost:8000/api/v1/docs)
#   db       localhost:5433               Postgres 16 (migrations applied on api start)
#   mailpit  http://localhost:8025        catches every email the API sends (SMTP :1025)
#
# Host ports can be changed if something else already uses them, e.g.
#   $env:POSTGRES_HOST_PORT = "5434"; docker compose up
#
# Not for production - prod runs deploy/docker-compose.prod.yml on EC2.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sustentra_admin
      POSTGRES_PASSWORD: local-admin-password
      POSTGRES_DB: sustentra
    ports:
      # Host 5433 (not 5432) so it doesn't clash with a Postgres already on this machine.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sustentra_admin -d sustentra"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025" # web UI
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: build # has the venv; source is bind-mounted for --reload
    working_dir: /app
    environment:
      ENVIRONMENT: local
      GIT_SHA: local
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      # Migrations run as the owner; the app connects as app_user (RLS enforced), like prod.
      MIGRATION_DATABASE_URL: postgresql://sustentra_admin:local-admin-password@db:5432/sustentra
      APP_DATABASE_URL: postgresql://app_user:local-app-password@db:5432/sustentra
      DATABASE_URL: postgresql://app_user:local-app-password@db:5432/sustentra
      OTP_HMAC_SECRET: local-otp-hmac-secret-not-for-prod
      SES_FROM_ADDRESS: no-reply@localhost
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      PYTHONPATH: /app
    command: >
      sh -c "cd /app/backend
      && DATABASE_URL=$$MIGRATION_DATABASE_URL alembic upgrade head
      && cd /app
      && uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir backend"
    volumes:
      - ./backend:/app/backend
      - ./contracts:/app/contracts:ro
      - ./reference-data:/app/reference-data:ro
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  web:
    image: node:22-alpine
    working_dir: /app
    environment:
      NEXT_PUBLIC_BACKEND_API_URL: http://localhost:8000
      NEXT_TELEMETRY_DISABLED: "1"
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0 --port 3000"
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  web_node_modules:
